name: Test and publish Forknook Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt pytest
      - name: Verify Forknook browser JavaScript
        run: node --check server/web/forknook.js
      - name: Test backend
        run: python -m pytest -q server/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read release version from metadata
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open("server/update_release.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./server
          build-args: |
            RI_VERSION=${{ steps.version.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gigabytegrove/forknook:latest
            ghcr.io/gigabytegrove/forknook:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/gigabytegrove/forknook
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Package a versioned, checksum-verified in-app update
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("server/update_release.json"))["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          (cd server && tar -czf "../dist/forknook-server-${VERSION}.tar.gz" \
            --exclude='__pycache__' \
            *.py web requirements.txt Dockerfile update_release.json)
          sha256sum "dist/forknook-server-${VERSION}.tar.gz" | awk '{print $1}' \
            > "dist/forknook-server-${VERSION}.sha256"
      - name: Publish a stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.FORKNOOK_RELEASE_TOKEN || github.token }}
        run: |
          set -Eeuo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" "dist/forknook-server-${VERSION}.tar.gz" \
            "dist/forknook-server-${VERSION}.sha256" \
            --target "$GITHUB_SHA" --title "Forknook $TAG" \
            --notes "Server code and UI update. Python dependencies, launcher and Docker image changes still require a container redeploy."
