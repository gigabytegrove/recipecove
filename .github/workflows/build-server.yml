name: Test and publish Recipe Importer Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt pytest
      - name: Test backend
        run: python -m pytest -q server/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gigabytegrove/recipe-importer:latest
            ghcr.io/gigabytegrove/recipe-importer:1.2.0
          labels: |
            org.opencontainers.image.source=https://github.com/gigabytegrove/recipe-importer
            org.opencontainers.image.version=1.2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
