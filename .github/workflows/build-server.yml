name: Test and publish Forknook Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r server/requirements.txt pytest
      - name: Test backend
        run: python -m pytest -q server/tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          build-args: |
            RI_VERSION=2.1.3
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gigabytegrove/forknook:latest
            ghcr.io/gigabytegrove/forknook:2.1.3
          labels: |
            org.opencontainers.image.source=https://github.com/gigabytegrove/forknook
            org.opencontainers.image.version=2.1.3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package a versioned, checksum-verified in-app update
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("server/update_release.json"))["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          (cd server && tar -czf "../dist/forknook-server-${VERSION}.tar.gz" \
            --exclude='__pycache__' \
            *.py web requirements.txt Dockerfile update_release.json)
          sha256sum "dist/forknook-server-${VERSION}.tar.gz" | awk '{print $1}' \
            > "dist/forknook-server-${VERSION}.sha256"
      - name: Publish a stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" "dist/forknook-server-${VERSION}.tar.gz" \
            "dist/forknook-server-${VERSION}.sha256" \
            --target "$GITHUB_SHA" --title "Forknook $TAG" \
            --notes "Server code and UI update. Python dependencies, launcher and Docker image changes still require a container redeploy."
