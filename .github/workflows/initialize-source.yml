name: Initialize Recipe Bridge Source
on:
  push:
    branches: [main]
    paths:
      - '.project-bootstrap/recipe-importer-source.tar.xz'
      - '.github/workflows/initialize-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack complete source tree
        shell: bash
        run: |
          set -euo pipefail
          echo '07ce50e3ed264508a65147d963ef7fe1bdf21d3c55771783b1492b91a35321e3  .project-bootstrap/recipe-importer-source.tar.xz' | sha256sum -c -
          tar -xJf .project-bootstrap/recipe-importer-source.tar.xz
          test -s android/app/src/main/java/dev/recipebridge/mobile/MainActivity.java
          test -s server/app.py
          test -s .github/workflows/build-apk.yml
          rm -rf .project-bootstrap
          rm -f .github/workflows/initialize-source.yml
      - name: Commit unpacked sources to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import Recipe Bridge 1.0.0 Android and video extractor source'
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.11.1
      - name: Build Android APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Save versioned APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk recipe-bridge-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-bridge-1.0.0-debug
          path: recipe-bridge-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
