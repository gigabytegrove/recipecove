name: Forknook dependency security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'
permissions:
  contents: read
jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check Python dependency advisories
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r server/requirements.txt
