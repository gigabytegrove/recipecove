services:
  recipe-importer:
    build: .
    container_name: recipe-importer
    restart: unless-stopped
    environment:
      KITCHENOWL_URL: ${KITCHENOWL_URL:?Set KITCHENOWL_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8999}:8999"
    volumes:
      - recipe-importer-data:/data
      - whisper-models:/models
      # Optional authorized Instagram cookie export:
      # - ./instagram_cookies.txt:/run/secrets/instagram_cookies.txt:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=300m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 3g
volumes:
  recipe-importer-data:
  whisper-models:
