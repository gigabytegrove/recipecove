services:
  recipecove:
    build: .
    container_name: recipecove
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-780}
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8999}:8999"
    volumes:
      - recipecove-data:/data
      - whisper-models:/models
      - forknook-temp:/tmp
      # Optional authorized Instagram cookie export:
      # - ./instagram_cookies.txt:/run/secrets/instagram_cookies.txt:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m
volumes:
  recipecove-data:
    external: true
    name: forknook_forknook-data
  whisper-models:
  forknook-temp:
